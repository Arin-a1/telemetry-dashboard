<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Telemetry</title>
</head>
<body>
  <h1>Telemetry Dashboard</h1>
  <label>Sensor:
    <select id="sensor">
        <option value="">All sensors</option>
        <option value="chamber_pressure">Chamber pressure</option>
        <option value="fuel_flow_rate">Fuel flow rate</option>
        <option value="chamber_temperature">Chamber temperature</option>
    </select>
    </label>
    <table>
        <thead>
            <tr><th>Time</th><th>Sensor</th><th>Value</th><th>Unit</th></tr>
        </thead>
        <tbody id="rows"></tbody>
        </table>
    <div id="charts"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

    <script>
        function groupBySensor(readings){
            const groups = {}; //creating an empty objects for the groups to live in
            for (const reading of readings){ //loop through all readings
                if (!groups[reading.sensor]){//if reading sensor name is not already in groups
                    groups[reading.sensor] = []; //add sensor name to groups and assign it to an empty list

                }
                groups[reading.sensor].push(reading); //add the reading to the list of readings with that particular sensor name
            }
            return groups;
        }





        let charts = {};  //initializing our charts outside the function so they survive between calls. this is an object holding one chart per sensor because we now have several to keep track of
        function drawCharts(readings){
            for (const chart in charts) charts[chart].destroy() //this removes all the old charts. without this, we would be drawing new charts on top of the old ones. this loops over the object keys (using "in" and not "of") 

            document.getElementById("charts").innerHTML = ""; //emptying out the html of all the charts we made before
            if (readings.length ===0) return;
            const groups = groupBySensor(readings); //{"chamber pressure": [{}, {}, {}, {}], "fuel_flow_rate": [{}, {}, {}]}
            for (const sensor of Object.keys(groups)){
                const ordered = [...groups[sensor]].reverse();
                const canvas = document.createElement("canvas"); //making a new chart for this particular sensor. building a new canvas for each sensor. 
                document.getElementById("charts").appendChild(canvas); //appending our new chart to our list of charts. appendchild puts it on the page
                charts[sensor] = new Chart(canvas,{ //this build the new chart with the type being line, the x-axis being labels and the
                type : "line",
                data : {
                    labels: ordered.map(r => r.timestamp), //each chart gets its own labels
                    datasets: [{
                        label:`${sensor} (${ordered[0].unit})`,
                        data: ordered.map(r => r.value),
                    }],
                },
            });
        }


           
        }

        





        function loadReadings() { //putting the fetching of the readings in a function so we can do it more than once
            const sensor = document.getElementById("sensor").value; //reads which option is currently selected
            let url ="http://127.0.0.1:8000/readings?limit=60"; //going to build on this url depending on if a sensor is selected or not
            if (sensor){ //if there is a sensor selected
                url += "&sensor=" + sensor; //add thtat sensor to the url that we are going to fetch from
            } 
    
            fetch(url) //this is a browsers way of sending a request. by default, fetch does a GET. limit=60 asks for the 60 newest readings
            .then(response => response.json()) //when the data arrives, convert it into readl data. same thing as json.loads (converts json formatted string into native python object like dictionary)
            .then(data => { //telling it what to do with the data when it arrives
                const tbody = document.getElementById("rows");
                tbody.innerHTML = ""; //this empties the table body before filling it again
                data.forEach(reading => {
                    const tr = document.createElement("tr"); //makes a new empty table row in memory
                    tr.innerHTML = `<td>${reading.timestamp}</td><td>${reading.sensor}</td><td>${reading.value}</td><td>${reading.unit}</td>`; //telling us how to fill that row. first one should have timestamp, second one should have sensor etc.
                    tbody.appendChild(tr); //attaches the finished row to the table
                })
                drawCharts(data);
            });
        }
        document.getElementById("sensor").addEventListener("change", loadReadings); //when the dropdown changes, run loadReadings again
        loadReadings(); //runs it once the page loads so we don't have empty table at the start
    </script>
</body>
</html>
